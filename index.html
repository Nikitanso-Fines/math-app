<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интегралы Офлайн</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #28a745; }
        canvas { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🧮 Офлайн Калькулятор</h2>
    <label>Функция f(x):</label>
    <input type="text" id="functionInput" value="x^2" placeholder="Например: x**2 + 2*x или sin(x)">
    
    <label>Нижний предел (a):</label>
    <input type="number" id="limitA" value="0">
    
    <label>Верхний предел (b):</label>
    <input type="number" id="limitB" value="3">
    
    <button onclick="calculateIntegral()">Вычислить определенный интеграл</button>
    <div id="result"></div>
    <canvas id="myChart"></canvas>
</div>

<script>
let myChart = null;

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Безопасный парсер математических выражений на чистом JS
function evaluateExpression(exprStr, xVal) {
    // Приводим функции к стандарту Math в JavaScript
    let formatted = exprStr.toLowerCase()
        .replace(/pow/g, 'Math.pow')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/exp/g, 'Math.exp')
        .replace(/pi/g, 'Math.PI')
        .replace(/\^/g, '**'); // Автозамена знака ^ на JS-степень **

    // Создаем изолированную функцию для расчета значения x
    const calc = new Function('x', `return ${formatted};`);
    return calc(xVal);
}

function calculateIntegral() {
    const exprStr = document.getElementById('functionInput').value;
    const a = parseFloat(document.getElementById('limitA').value);
    const b = parseFloat(document.getElementById('limitB').value);
    
    try {
        const steps = 1000;
        const h = (b - a) / steps;
        
        let sum = 0.5 * (evaluateExpression(exprStr, a) + evaluateExpression(exprStr, b));
        
        for (let i = 1; i < steps; i++) {
            sum += evaluateExpression(exprStr, a + i * h);
        }
        const integralValue = sum * h;
        
        if (isNaN(integralValue) || !isFinite(integralValue)) {
            throw new Error();
        }
        
        document.getElementById('result').innerText = `Результат: ${integralValue.toFixed(4)}`;
        buildChart(exprStr, a, b);
    } catch (error) {
        document.getElementById('result').style.color = 'red';
        document.getElementById('result').innerText = 'Ошибка в формуле или расчетах!';
    }
}

function buildChart(exprStr, a, b) {
    const ctx = document.getElementById('myChart').getContext('2d');
    const labels = [];
    const data = [];
    const start = a - 1;
    const end = b + 1;
    
    for (let x = start; x <= end; x += (end - start) / 40) {
        labels.push(x.toFixed(1));
        try {
            let y = evaluateExpression(exprStr, x);
            data.push(isFinite(y) ? y : 0);
        } catch(e) { 
            data.push(0); 
        }
    }
    
    if (myChart) myChart.destroy();
    
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'f(x)',
                data: data,
                borderColor: '#007bff',
                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                fill: true,
                tension: 0.2
            }]
        },
        options: { 
            responsive: true,
            scales: {
                y: { beginAtZero: false }
            }
        }
    });
}
</script>
</body>
</html>
