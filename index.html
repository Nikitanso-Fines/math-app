<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интегралы Офлайн</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; font-size: 1.3em; text-align: center; }
        
        .integral-plate { display: flex; align-items: center; justify-content: center; margin: 20px 0; padding: 15px; background-color: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; font-size: 1.4em; font-family: "Times New Roman", Times, serif; }
        .minus-sign { color: #dc3545; font-size: 1.4em; margin-right: 5px; font-family: Arial, sans-serif; }
        
        .integral-sign-container { display: inline-flex; position: relative; font-size: 2.2em; line-height: 1; margin-right: 25px; padding-right: 5px; user-select: none; }
        .limit-top { position: absolute; top: -0.05em; left: 0.55em; font-size: 0.45em; font-weight: normal; }
        .limit-bottom { position: absolute; bottom: -0.05em; left: 0.45em; font-size: 0.45em; font-weight: normal; }
        .function-text { font-size: 1.1em; margin-left: 2px; }
        
        .graph-area { margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .svg-container { width: 100%; height: 180px; background: #fff; border-bottom: 2px solid #333; border-left: 2px solid #333; position: relative; }
        .labels { display: flex; justify-content: space-between; width: 100%; margin-top: 5px; font-size: 0.8em; color: #666; font-family: Arial, sans-serif; }
    </style>
</head>
<body>
<div class="container">
    <h2>🧮 Офлайн Калькулятор Интегралов</h2>
    <label>Функция f(x):</label>
    <input type="text" id="functionInput" value="x^3" placeholder="Например: x^2 или sin(x)">
    
    <label>(a):</label>
    <input type="number" id="limitA" value="-3">
    
    <label>(b):</label>
    <input type="number" id="limitB" value="3">
    
    <button onclick="calculateAll()">Вычислить интеграл</button>
    
    <div class="integral-plate" id="integralPlateVisual" style="display: none;"></div>
    
    <div id="result"></div>
    
    <div class="graph-area">
        <div class="svg-container" id="chartContainer"></div>
        <div class="labels" id="chartLabels"></div>
    </div>
</div>

<script>
function evaluateExpression(exprStr, xVal) {
    let formatted = exprStr.toLowerCase()
        .replace(/pow/g, 'Math.pow')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/exp/g, 'Math.exp')
        .replace(/pi/g, 'Math.PI')
        .replace(/\^/g, '**');

    const calc = new Function('x', `return ${formatted};`);
    return calc(xVal);
}

function decimalToFraction(val) {
    let tolerance = 1.0e-6;
    let h1 = 1; let h2 = 0;
    let k1 = 0; let k2 = 1;
    let b = val;
    do {
        let a = Math.floor(b);
        let aux = h1; h1 = a * h1 + h2; h2 = aux;
        aux = k1; k1 = a * k1 + k2; k2 = aux;
        b = 1 / (b - a);
    } while (Math.abs(val - h1 / k1) > val * tolerance);

    if (k1 === 1) return h1.toString();
    return h1 + "/" + k1;
}

function calculateAll() {
    const exprStr = document.getElementById('functionInput').value;
    const a = parseFloat(document.getElementById('limitA').value);
    const b = parseFloat(document.getElementById('limitB').value);
    
    try {
        const steps = 1000;
        const h = (b - a) / steps;
        
        let totalSum = 0;
        let hasNegativeY = false;

        for (let i = 0; i < steps; i++) {
            let x1 = a + i * h;
            let x2 = a + (i + 1) * h;
            
            let y1 = evaluateExpression(exprStr, x1);
            let y2 = evaluateExpression(exprStr, x2);
            
            let currentY = (y1 + y2) / 2;
            let area = currentY * h;
            
            if (currentY < 0) {
                hasNegativeY = true;
                totalSum += (-1) * area;
            } else {
                totalSum += area;
            }
        }
        
        const plate = document.getElementById('integralPlateVisual');
        plate.style.display = 'flex';
        
        let minusHtml = hasNegativeY ? '<span class="minus-sign">−</span>' : '';
        
        plate.innerHTML = `
            ${minusHtml}
            <span class="integral-sign-container">
                ∫
                <span class="limit-top">${b}</span>
                <span class="limit-bottom">${a}</span>
            </span>
            <span class="function-text">(${exprStr}) dx</span>
        `;
        
        const resultBlock = document.getElementById('result');
        resultBlock.style.color = '#28a745';
        
        let fractionStr = decimalToFraction(Math.abs(totalSum));
        resultBlock.innerText = `Интеграл: ${totalSum.toFixed(4)} (${fractionStr})`;
        
        buildVectorChart(exprStr, a, b);
    } catch (error) {
        document.getElementById('result').style.color = 'red';
        document.getElementById('result').innerText = 'Ошибка в формуле или расчетах!';
        document.getElementById('integralPlateVisual').style.display = 'none';
    }
}

function buildVectorChart(exprStr, a, b) {
    const container = document.getElementById('chartContainer');
    const labelsContainer = document.getElementById('chartLabels');
    container.innerHTML = '';
    labelsContainer.innerHTML = '';
    
    const pointsCount = 50;
    const step = (b - a) / (pointsCount - 1);
    let points = [];
    
    for (let i = 0; i < pointsCount; i++) {
        let currentX = a + i * step;
        try {
            let y = evaluateExpression(exprStr, currentX);
            points.push({x: i, y: isFinite(y) ? y : 0});
        } catch(e) { points.push({x: i, y: 0}); }
    }
    
    let yVals = points.map(p => p.y);
    let maxY = Math.max(...yVals, 1);
    let minY = Math.min(...yVals, -1);
    let rangeY = maxY - minY;
    
    let width = container.clientWidth || 460;
    let height = 180;
    
    let svgHtml = `<svg width="100%" height="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">`;
    
    let zeroY = height - ((0 - minY) / rangeY) * height;
    if (zeroY >= 0 && zeroY <= height) {
        svgHtml += `<line x1="0" y1="${zeroY}" x2="${width}" y2="${zeroY}" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>`;
    }
    
    let pathData = "";
    points.forEach((p, index) => {
        let posX = (index / (pointsCount - 1)) * width;
        let posY = height - ((p.y - minY) / rangeY) * height;
        if (index === 0) {
            pathData += `M ${posX} ${posY}`;
        } else {
            pathData += ` L ${posX} ${posY}`;
        }
    });
    
    svgHtml += `<path d="${pathData}" fill="none" stroke="#007bff" stroke-width="3" />`;
    svgHtml += `</svg> `;
    
    container.innerHTML = svgHtml;
    
    const labelStart = document.createElement('span');
    labelStart.innerText = a.toFixed(1);
    const labelEnd = document.createElement('span');
    labelEnd.innerText = b.toFixed(1);
    labelsContainer.appendChild(labelStart);
    labelsContainer.appendChild(labelEnd);
}
</script>
</body>
</html>
