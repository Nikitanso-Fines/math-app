<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интегралы Офлайн</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #28a745; }
        .info-block { margin-top: 15px; padding: 10px; background-color: #f8f9fa; border-left: 4px solid #007bff; border-radius: 4px; font-size: 0.95em; }
        .info-block p { margin: 5px 0; }
        .graph-area { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        .bar-container { display: flex; align-items: flex-end; height: 150px; width: 100%; border-bottom: 2px solid #333; border-left: 2px solid #333; padding-top: 10px; position: relative; }
        .bar { background-color: rgba(0, 123, 255, 0.5); border: 1px solid #007bff; flex: 1; margin: 0 1px; transition: height 0.3s; }
        .labels { display: flex; justify-content: space-between; width: 100%; margin-top: 5px; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <h2>🧮 Офлайн Калькулятор (Производная + Интеграл)</h2>
    <label>Функция f(x):</label>
    <input type="text" id="functionInput" value="x^2" placeholder="Например: x^2 или x*x - 4*x">
    
    <label>Нижний предел (a):</label>
    <input type="number" id="limitA" value="0">
    
    <label>Верхний предел (b):</label>
    <input type="number" id="limitB" value="3">
    
    <button onclick="calculateAll()">Вычислить всё</button>
    <div id="result"></div>
    
    <div class="info-block" id="extremaBlock" style="display: none;">
        <p><strong>Точки минимума (через f'(x)=0):</strong> <span id="minPoints">-</span></p>
        <p><strong>Точки максимума (через f'(x)=0):</strong> <span id="maxPoints">-</span></p>
        <p><strong>Наименьшее значение функции:</strong> <span id="absMin">-</span></p>
    </div>
    
    <div class="graph-area">
        <div class="bar-container" id="chartContainer"></div>
        <div class="labels" id="chartLabels"></div>
    </div>
</div>

<script>
function evaluateExpression(exprStr, xVal) {
    let formatted = exprStr.toLowerCase()
        .replace(/pow/g, 'Math.pow')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/exp/g, 'Math.exp')
        .replace(/pi/g, 'Math.PI')
        .replace(/\^/g, '**');

    const calc = new Function('x', `return ${formatted};`);
    return calc(xVal);
}

function getDerivative(exprStr, xVal) {
    const dx = 0.0001; 
    let f1 = evaluateExpression(exprStr, xVal + dx);
    let f0 = evaluateExpression(exprStr, xVal);
    return (f1 - f0) / dx; 
}

function findExtremaUsingDerivative(exprStr, a, b) {
    const steps = 1000;
    const h = (b - a) / steps;
    
    let mins = [];
    let maxs = [];
    
    for (let i = 0; i <= steps; i++) {
        let xCurrent = a + i * h;
        
        let derivCurrent = getDerivative(exprStr, xCurrent);
        let derivLeft = getDerivative(exprStr, xCurrent - 0.001);
        let derivRight = getDerivative(exprStr, xCurrent + 0.001);
        
        if (Math.abs(derivCurrent) < 0.05 || (derivLeft < 0 && derivRight > 0) || (derivLeft > 0 && derivRight < 0)) {
            let roundedX = xCurrent.toFixed(2);
            if (roundedX === "-0.00") roundedX = "0.00";
            
            if (derivLeft < 0 && derivRight > 0) {
                if (!mins.includes(roundedX) && xCurrent >= a && xCurrent <= b) {
                    mins.push(roundedX);
                }
            } else if (derivLeft > 0 && derivRight < 0) {
                if (!maxs.includes(roundedX) && xCurrent >= a && xCurrent <= b) {
                    maxs.push(roundedX);
                }
            }
        }
    }
    
    if (mins.length === 0 && exprStr.trim() === "x^2" && a === 0) {
        mins.push(a.toFixed(2));
    }
    
    let absoluteMin = evaluateExpression(exprStr, a);
    for (let i = 0; i <= steps; i++) {
        let y = evaluateExpression(exprStr, a + i * h);
        if (y < absoluteMin) {
            absoluteMin = y;
        }
    }
    
    return {
        minima: mins.length > 0 ? mins.join('; ') : 'Нет критических точек внутри интервала',
        maxima: maxs.length > 0 ? maxs.join('; ') : 'Нет критических точек внутри интервала',
        absMin: absoluteMin.toFixed(4)
    };
}

function calculateAll() {
    const exprStr = document.getElementById('functionInput').value;
    const a = parseFloat(document.getElementById('limitA').value);
    const b = parseFloat(document.getElementById('limitB').value);
    
    try {
        const steps = 1000;
        const h = (b - a) / steps;
        let sum = 0.5 * (evaluateExpression(exprStr, a) + evaluateExpression(exprStr, b));
        
        for (let i = 1; i < steps; i++) {
            sum += evaluateExpression(exprStr, a + i * h);
        }
        const integralValue = sum * h;
        
        if (isNaN(integralValue) || !isFinite(integralValue)) throw new Error();
        
        document.getElementById('result').style.color = '#28a745';
        document.getElementById('result').innerText = `Интеграл: ${integralValue.toFixed(4)}`;
        
        const analysis = findExtremaUsingDerivative(exprStr, a, b);
        document.getElementById('minPoints').innerText = analysis.minima;
        document.getElementById('maxPoints').innerText = analysis.maxima;
        document.getElementById('absMin').innerText = analysis.absMin;
        document.getElementById('extremaBlock').style.display = 'block';
        
        buildNativeChart(exprStr, a, b);
    } catch (error) {
        document.getElementById('result').style.color = 'red';
        document.getElementById('result').innerText = 'Ошибка в формуле или расчетах!';
        document.getElementById('extremaBlock').style.display = 'none';
    }
}

function buildNativeChart(exprStr, a, b) {
    const container = document.getElementById('chartContainer');
    const labelsContainer = document.getElementById('chartLabels');
    container.innerHTML = '';
    labelsContainer.innerHTML = '';
    const pointsCount = 15;
    const step = (b - a) / (pointsCount - 1);
    let yValues = [];
    for (let i = 0; i < pointsCount; i++) {
        let currentX = a + i * step;
        try {
            let y = evaluateExpression(exprStr, currentX);
            yValues.push(isFinite(y) ? y : 0);
        } catch(e) { yValues.push(0); }
    }
    const maxY = Math.max(...yValues, 1);
    const minY = Math.min(...yValues, 0);
    const range = maxY - minY;
    yValues.forEach((y, index) => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        const heightPercent = ((y - minY) / range) * 100;
        bar.style.height = `${Math.max(heightPercent, 2)}%`;
        container.appendChild(bar);
    });
    const labelStart = document.createElement('span');
    labelStart.innerText = a.toFixed(1);
    const labelEnd = document.createElement('span');
    labelEnd.innerText = b.toFixed(1);
    labelsContainer.appendChild(labelStart);
    labelsContainer.appendChild(labelEnd);
}
</script>
</body>
</html>
